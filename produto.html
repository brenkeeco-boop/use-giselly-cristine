<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produto — Use Giselly Cristine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/layout.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/header.css" />
</head>
<body>

<div id="headerMount"></div>

<main class="wrap">
  <p class="breadcrumb">
    <a href="index.html">Início</a><span class="sep">/</span>
    <a href="catalogo.html" id="crumbCat">Categoria</a><span class="sep">/</span>
    <span id="crumbName">Produto</span>
  </p>

  <div class="product-page" id="productPage"></div>

  <section class="section" style="padding-top:0">
    <div class="section-head">
      <h2>Você também pode gostar</h2>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</main>

<footer class="site-footer" id="footerMount"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/categories.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  mountLayout();
  const pageEl = document.getElementById("productPage");
  const relatedEl = document.getElementById("relatedGrid");
  const crumbCatEl = document.getElementById("crumbCat");
  const crumbNameEl = document.getElementById("crumbName");
  const productId = new URLSearchParams(location.search).get("id");
  const LOAD_ERROR_MSG = "Não foi possível carregar os produtos agora. Verifique sua conexão e tente novamente.";
  const relatedSection = relatedEl.closest("section");
  let pageBound = false;

  function setRelatedVisible(show){ if (relatedSection) relatedSection.style.display = show ? "" : "none"; }

  function showLoading(){
    document.title = "Carregando… — Use Giselly Cristine";
    crumbNameEl.textContent = "Carregando…";
    pageEl.innerHTML = `<div class="catalog-empty"><p>Carregando produto…</p></div>`;
    relatedEl.innerHTML = "";
    setRelatedVisible(false);
  }

  function showError(message){
    document.title = "Erro — Use Giselly Cristine";
    crumbNameEl.textContent = "Produto";
    pageEl.innerHTML = `<div class="catalog-empty"><h2>Não foi possível carregar o produto</h2><p></p><button type="button" class="btn btn-outline" id="retryProductBtn">Tentar novamente</button></div>`;
    pageEl.querySelector("p").textContent = message || LOAD_ERROR_MSG;
    relatedEl.innerHTML = "";
    setRelatedVisible(false);
    document.getElementById("retryProductBtn").addEventListener("click", retryProduct);
  }

  function showNotFound(){
    document.title = "Produto não encontrado — Use Giselly Cristine";
    crumbNameEl.textContent = "Produto não encontrado";
    pageEl.innerHTML = `<div class="catalog-empty"><h2>Produto não encontrado</h2><p>Este produto não existe ou não está mais disponível.</p><a href="catalogo.html" class="btn btn-outline">Ver catálogo</a></div>`;
    relatedEl.innerHTML = "";
    setRelatedVisible(false);
  }

  /* carregando → catalogReady → verificar resultado → localizar produto → renderizar */
  async function initProduct(readyPromise){
    showLoading();
    let result = null;
    try { result = await readyPromise; } catch (e) { result = null; }
    if (!result || result.ok !== true){ showError(result && result.error && result.error.message); return; }
    const product = productId ? getProductById(productId) : null;
    if (!product){ showNotFound(); return; }
    renderProduct(product);
  }

  function retryProduct(){
    if (window.UGCCatalog && typeof UGCCatalog.reload === "function") initProduct(UGCCatalog.reload());
    else location.reload();
  }

  function renderProduct(product){
    /* product.name / description / category / images já vêm escapados do catalog.js (seguros para innerHTML).
       Para textContent e document.title usa-se rawName. product.estoque é o estoque real (inteiro ou null);
       nesta etapa ele só fica disponível, sem alterar nenhuma regra de compra. */
    const catLabel = CATEGORY_LABELS[product.category] || product.category;
    const hasColors = product.colors.length > 0;
    const hasSizes = product.sizes.length > 0;
    const selectedColor = hasColors ? product.colors[0] : null;
    const images = selectedColor && selectedColor.images.length ? selectedColor.images : product.images;

    document.title = `${product.rawName} — Use Giselly Cristine`;
    crumbCatEl.innerHTML = catLabel;
    crumbCatEl.href = `catalogo.html?cat=${encodeURIComponent(product.category)}`;
    crumbNameEl.textContent = product.rawName;

    pageEl.dataset.estoque = product.variantStock == null ? "" : String(product.variantStock);
    pageEl.__ugcProduct = product;
    pageEl.innerHTML = `
    <div class="gallery">
      <div class="gallery-main">${images.length ? `<img id="mainImg" src="${images[0]}" alt="${product.name}">` : ""}</div>
      <div class="gallery-thumbs">
        ${images.map((img, i) => `<button data-img="${img}" class="${i===0?'active':''}"><img src="${img}" alt=""></button>`).join("")}
      </div>
    </div>
    <div class="pd-details">
      <span class="label">${catLabel}</span>
      <h1 class="pd-name">${product.name}</h1>
      <div class="pd-price">
        ${product.oldPrice ? `<span class="old">${formatBRL(product.oldPrice)}</span><span class="now">${formatBRL(product.price)}</span>` : `<span>${formatBRL(product.price)}</span>`}
      </div>
      <p class="pd-installment">em até 6x de ${formatBRL(product.price/6)} sem juros ou 10% off no Pix</p>
      <p class="pd-desc">${product.description}</p>

      ${hasColors ? `<div class="pd-option">
        <div class="opt-head"><span>Cor: <strong id="colorLabel">${product.colors[0].name}</strong></span></div>
        <div class="swatch-row" id="colorRow">
          ${product.colors.map((c,i) => `<button type="button" class="swatch ${i===0?'selected':''}" data-color="${c.name}" data-color-index="${i}" aria-label="Selecionar cor ${c.name}" aria-pressed="${i===0}">${c.name}</button>`).join("")}
        </div>
      </div>` : ""}

      ${hasSizes ? `<div class="pd-option">
        <div class="opt-head"><span>Tamanho</span><a href="#" class="guide-link" id="sizeGuideLink" data-open-size-guide>guia de medidas</a></div>
        <div class="size-row" id="sizeRow">
          ${(hasColors ? ["P","M","G"] : product.sizes).map((s,i) => `<button class="size-opt ${selectedColor && !(selectedColor.stock[s] > 0) ? 'is-soldout' : (i===0?'selected':'')}" data-size="${s}" ${selectedColor && !(selectedColor.stock[s] > 0) ? 'disabled aria-disabled="true"' : ''}>${s}</button>`).join("")}
        </div>
      </div>` : ""}

      <div class="pd-actions">
        <button class="btn btn-wine" id="addToCartBtn">Adicionar ao carrinho</button>
        <button class="fav-btn-lg" id="favBtnLg" data-fav="${product.id}" aria-label="Favoritar ${product.name}">${ICONS.heart}</button>
      </div>

      <div class="pd-info-list">
        <details open>
          <summary>Envio e entrega</summary>
          <p>Enviamos para todo o Brasil. Prazo estimado de 5 a 12 dias úteis conforme a região, com frete grátis em compras acima de R$ 399.</p>
        </details>
        <details>
          <summary>Trocas e devoluções</summary>
          <p>Você tem até 30 dias corridos após o recebimento para solicitar troca ou devolução, com a peça em perfeito estado.</p>
        </details>
        <details>
          <summary>Guia de medidas</summary>
          <p>Consulte a tabela de medidas de cada categoria antes de finalizar sua escolha para garantir o caimento ideal.</p>
        </details>
      </div>
    </div>`;

    relatedEl.innerHTML = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,4).map(productCardHTML).join("");
    setRelatedVisible(relatedEl.children.length > 0);
    document.querySelectorAll("[data-fav]").forEach(b => b.classList.toggle("active", isFavorite(b.dataset.fav)));

    /* Produtos do banco ainda não têm tamanhos/cores cadastrados. Quando não há opção a escolher,
       envia texto vazio: nada é inventado. (null não serve: cart.js compara com .eq("tamanho", ...),
       e .eq(col, null) não casa com NULL no banco.) */
    document.getElementById("addToCartBtn").addEventListener("click", async () => {
      const sizeEl = document.querySelector("#sizeRow .size-opt.selected");
      const colorEl = document.getElementById("colorLabel");
      const size = sizeEl ? sizeEl.dataset.size : "";
      const color = colorEl ? colorEl.textContent : "";
      const selected = product.hasVariants ? product.colors[Number(document.querySelector("#colorRow .swatch.selected").dataset.colorIndex)] : null;
      if (product.hasVariants && (!size || !color)) { alert("Escolha uma cor e um tamanho disponível."); return; }
      const added = await addToCart(product.id, size, color, 1, { image: selected && selected.images[0] ? selected.images[0] : product.images[0] });
      if (!added) return;
      const btn = document.getElementById("addToCartBtn");
      btn.textContent = "Adicionado à sacola ✓";
      setTimeout(() => btn.textContent = "Adicionar ao carrinho", 1500);
    });
  }

  /* Delegação de cliques: registrada uma única vez, vale para qualquer re-renderização. */
  pageEl.addEventListener("click", (e) => {
    const thumb = e.target.closest("[data-img]");
    if (thumb){
      const main = document.getElementById("mainImg");
      if (main) main.src = thumb.dataset.img;
      document.querySelectorAll(".gallery-thumbs button").forEach(b => b.classList.remove("active"));
      thumb.classList.add("active");
    }
    const colorSw = e.target.closest("#colorRow .swatch");
    if (colorSw){
      document.querySelectorAll("#colorRow .swatch").forEach(s => { s.classList.remove("selected"); s.setAttribute("aria-pressed", "false"); });
      colorSw.classList.add("selected");
      colorSw.setAttribute("aria-pressed", "true");
      document.getElementById("colorLabel").textContent = colorSw.dataset.color;
      const product = pageEl.__ugcProduct;
      const color = product && product.colors[Number(colorSw.dataset.colorIndex)];
      if (color) {
        const images = color.images.length ? color.images : product.images;
        const main = document.querySelector(".gallery-main");
        const thumbs = document.querySelector(".gallery-thumbs");
        if (main) main.innerHTML = images.length ? `<img id="mainImg" src="${images[0]}" alt="${product.name}">` : "";
        if (thumbs) thumbs.innerHTML = images.map((img, i) => `<button data-img="${img}" class="${i===0?'active':''}"><img src="${img}" alt=""></button>`).join("");
        document.querySelectorAll("#sizeRow .size-opt").forEach(function (button, index) {
          const available = color.stock[button.dataset.size] > 0;
          button.disabled = !available; button.classList.toggle("is-soldout", !available);
          button.classList.toggle("selected", available && index === 0);
          button.setAttribute("aria-disabled", String(!available));
        });
      }
    }
    const sizeBtn = e.target.closest("#sizeRow .size-opt");
    if (sizeBtn && !sizeBtn.disabled){
      document.querySelectorAll("#sizeRow .size-opt").forEach(b => b.classList.remove("selected"));
      sizeBtn.classList.add("selected");
    }
  });

  initProduct(window.catalogReady);
</script>
</body>
</html>
